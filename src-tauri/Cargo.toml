[package]
name = "xtweaks"
version = "1.0.1"
description = "Vortex-Optimizer — Fluent-inspired Windows 11 optimization interface"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xtweaks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
sysinfo = "0.32"
winreg = "0.55"
wmi = "0.15"
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_NetworkManagement_Dns",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
